# Configuration nginx pour servir l'application (fichiers statiques uniquement).
# Utilisée par le Dockerfile (copiée dans /etc/nginx/conf.d/default.conf).
#
# Pour des milliers de visiteurs simultanés, pensez aussi à placer un CDN devant
# (Cloudflare, par exemple) et, dans nginx.conf principal :
#   worker_processes auto;
#   events { worker_connections 4096; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fichiers versionnés (hash dans le nom) : cache longue durée
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Page d'entrée : toujours revalidée pour que les mises à jour soient immédiates
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    server_tokens off;
}
